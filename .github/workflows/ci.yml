name: CI

on:
  push:
    branches: [main]
  pull_request:
  # "Run workflow" on the Actions tab: lets a fork set up or migrate its
  # database without a clone.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Pull requests drop stale runs; main always finishes, so a migration is
  # never cut off halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # typecheck runs `tsr generate`, which drops the Start block the Vite plugin writes into routeTree.gen.ts, so CI doesn't diff the route trees.
      - run: pnpm test

  # Rebase merges put every commit of a pull request on main, and release-please
  # reads each one for the changelog, so each must be a Conventional Commit.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm commitlint --from "$BASE" --to "$HEAD" --verbose
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  # Applies new migrations to the production database once main passes, on
  # a push or a manual run. Needs TURSO_DATABASE_URL and TURSO_AUTH_TOKEN in
  # the repo's Actions secrets; a fork without them skips this job's work.
  migrate:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: migrate
      cancel-in-progress: false
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - name: No database secrets
        if: env.TURSO_DATABASE_URL == ''
        run: echo "::notice::TURSO_DATABASE_URL isn't set in this repo's Actions secrets, so no migrations ran."

      - uses: actions/checkout@v4
        if: env.TURSO_DATABASE_URL != ''

      - uses: pnpm/action-setup@v4
        if: env.TURSO_DATABASE_URL != ''

      - uses: actions/setup-node@v4
        if: env.TURSO_DATABASE_URL != ''
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: env.TURSO_DATABASE_URL != ''

      # Skips migrations already applied, so every push to main is safe.
      - run: pnpm db:migrate
        if: env.TURSO_DATABASE_URL != ''
