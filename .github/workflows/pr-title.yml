name: PR title

on:
  pull_request_target:
    types: [opened, reopened, edited]

jobs:
  # A squash merge turns the title into the commit that release-please later
  # reads on main, so it has to be a Conventional Commit. Rebase merges keep each
  # commit instead; CI lints those (`commits` in ci.yml).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            chore
            refactor
            style
            test
            build
            ci
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            Start the subject of "{title}" with a lowercase letter, like
            "fix(app): keep the outbox order after a retry".
